<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>
/* Sin el nombre del bar en el enlace (?bar=…) no se abre ninguna carta: se va a la página de MultiBar ("escanea el QR de tu mesa"). */
(function(){ try { var b = (new URLSearchParams(location.search).get('bar') || '').trim().toLowerCase();
  if(!/^[a-z0-9][a-z0-9-]{1,39}$/.test(b)) location.replace('../'); } catch(e) {} })();
</script>
<script>
/* Siempre la última versión: GitHub Pages deja la página guardada en el
   móvil hasta ~10 min. Al abrir, se pregunta (sin caché) qué versión hay
   publicada en version.json; si es más nueva que esta, se recarga sola
   con ?v=N (otra dirección, así que llega la nueva). Al publicar una
   versión: subir VERSION_WEB aquí, en carta/ y panel/, los ?v= de los
   archivos y el número de version.json. */
var VERSION_WEB = 19;
(function(){ try {
  fetch('../version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if(!j || !(Number(j.version) > VERSION_WEB)) return;
      var u = new URL(location.href);
      if(u.searchParams.get('v') === String(j.version)) return; // ya se intentó: no dar vueltas
      u.searchParams.set('v', String(j.version));
      location.replace(u.href);
    }).catch(function(){ /* sin conexión: se sigue con esta */ });
} catch(e) {} })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#22262E" data-bar>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carta" data-bar>

<!-- Aspecto del bar (colores, fuentes, logo, icono y textos): sale de sus
     ajustes en la base (ver comun/aspecto.js). Se pinta ya con lo que se
     recordó la última vez; si es la primera, la carta espera a saberlo
     para no enseñar un momento colores que no son del bar. El icono y el
     nombre para instalar la carta en el móvil también son de cada bar. -->
<script src="../comun/aspecto.js?v=19"></script>
<script>
(function(){
  var info = null;
  try { var b = (new URLSearchParams(location.search).get('bar') || '').trim().toLowerCase(); info = JSON.parse(localStorage.getItem('bar.' + b)); } catch(e) {}
  if(info && info.nombre && info._v === 2) Aspecto.aplicar(info, { instalable: true }); else Aspecto.esperar();
})();
</script>

<title>Carta digital</title>
<link rel="stylesheet" href="../comun/estilos.css?v=19">
<link rel="stylesheet" href="carta.css?v=19">
</head>
<body>

<div class="paper">
  <div class="sticky-top">
    <div class="ticket-head">
      <!-- Nombre y subtítulo del bar: los pone carta.js con lo que dice la base -->
      <img class="bar-logo" id="barLogo" data-logo-bar alt="" hidden>
      <div class="store" id="barNombre" data-nombre-bar>&nbsp;</div>
      <div class="head-extra">
        <p class="hero-line">&nbsp;</p>
      </div>
    </div>

    <div class="cat-tabs-wrap">
      <div class="cat-tabs" id="catTabs"></div>
    </div>
  </div>

  <div id="menu"></div>

  <footer>
    <!-- Líneas del pie de cada bar (ajustes.pie en la base) -->
    <div id="barPie"></div>
    <div class="legal-enlace" id="legalEnlace" hidden><a id="legalLink" href="../legal/">Aviso legal y privacidad</a></div>
    <div class="version">Carta v19</div>
    <div class="firma"><a href="https://www.autonomialab.es" target="_blank" rel="noopener">Carta digital por <b>autonomIA Lab</b></a></div>
  </footer>
</div>

<div class="photo-modal" id="photoModal"><div class="photo-card" id="photoCard"></div></div>

<div class="fixed-bottom">
  <button class="top-send" id="bottomSendBtn">Enviar pedido a barra</button>
  <div class="dock">
    <div class="dock-inner">
      <div>
        <div class="lbl" id="cartCountLbl">0 líneas</div>
        <div class="amt" id="cartTotalLbl">0,00€</div>
      </div>
      <!-- «Llamar al camarero» / «Pedir la cuenta» (opción del bar avisos_mesa, solo con el QR de la mesa) -->
      <button class="llamar" id="llamarBtn" type="button" hidden aria-label="Llamar al camarero o pedir la cuenta"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span>CAMARERO</span></button>
      <button class="cta" id="openCartBtn">VER TIQUE</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<div class="panel" id="panel">
  <div class="panel-head">
    <h2 id="txtTuTique">TU TIQUE</h2>
    <button class="panel-close" id="closePanelBtn">✕</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
  <div class="panel-foot">
    <div class="barcode"></div>
    <div class="total-row"><span id="txtTotal">TOTAL CUENTA</span><span class="amt" id="panelTotal">0,00 €</span></div>
    <button class="send-btn" id="sendBtn">ENVIAR PEDIDO A BARRA</button>
    <p class="note">El pago se hace en la barra, al recoger o al terminar la fiesta.</p>
    <p class="pie-tique" id="pieTique"></p>
  </div>
</div>

<div class="confirm" id="llamarHoja">
  <div class="confirm-card hoja-llamar">
    <div class="stamp-mark">¿QUÉ NECESITAS?</div>
    <button type="button" class="ll-op" data-tipo="camarero">Llamar al camarero</button>
    <button type="button" class="ll-op" data-tipo="cuenta">Pedir la cuenta</button>
    <button type="button" class="ll-cancelar" id="llamarCancelar">Cancelar</button>
  </div>
</div>

<div class="confirm" id="confirm">
  <div class="confirm-card">
    <div class="stamp-mark">PEDIDO ENVIADO</div>
    <p id="confirmText">Va para la barra. Pide otra ronda cuando quieras.</p>
    <button id="confirmClose">Vale</button>
  </div>
</div>

<script src="../comun/datos.js?v=19"></script>
<script src="carta.js?v=19"></script>
</body>
</html>
