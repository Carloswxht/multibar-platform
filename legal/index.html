<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>
/* Sin el nombre del bar en el enlace (?bar=…) no se abre ninguna carta: se va a la página de MultiBar ("escanea el QR de tu mesa"). */
(function(){ try { var b = (new URLSearchParams(location.search).get('bar') || '').trim().toLowerCase();
  if(!/^[a-z0-9][a-z0-9-]{1,39}$/.test(b)) location.replace('../'); } catch(e) {} })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Aviso legal y privacidad</title>
<link rel="stylesheet" href="../comun/estilos.css?v=19">
<link rel="stylesheet" href="legal.css?v=19">
<script src="../comun/aspecto.js?v=19"></script>
<script>
(function(){ var i = null; try { var b = (new URLSearchParams(location.search).get('bar') || '').trim().toLowerCase(); i = JSON.parse(localStorage.getItem('bar.' + b)); } catch(e) {}
  if(i && i._v === 2) Aspecto.aplicar(i); })();
</script>
</head>
<body>

<!-- Aviso legal y política de privacidad de cada bar (MultiBar).
     El texto es común a todos los bares; los datos del titular salen de la
     base (ajustes.legal del bar): titular, nif, domicilio, email y,
     opcionales, telefono y registro. Sin esos datos, la página lo dice. -->
<header class="cab">
  <a class="volver" id="volver" href="../carta/">← Volver a la carta</a>
  <img class="logo" data-logo-bar alt="" hidden>
  <div class="local" id="local" data-nombre-bar>&nbsp;</div>
  <h1>Aviso legal y privacidad</h1>
  <nav class="indice"><a href="#aviso">Aviso legal</a><a href="#privacidad">Privacidad</a></nav>
</header>

<main id="contenido">
  <p class="cargando">Cargando…</p>
</main>

<footer class="pie"><a class="enlace-firma" href="https://www.autonomialab.es" target="_blank" rel="noopener">Plataforma MultiBar por <b>autonomIA Lab</b></a></footer>

<script src="../comun/datos.js?v=19"></script>
<script src="legal.js?v=19"></script>
</body>
</html>
